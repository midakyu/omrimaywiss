<!DOCTYPE html>
<html>
<head>
    <title>Protein Calculator</title>
    <meta charset="utf-8" />
    <script src="/client.js" defer></script>
</head>
<body>
    <header>
        <h1>Daily Protein Calculator</h1>
    </header>
    <main>
        <h3>Calculate your daily protein intake:</h3>
        <form>
            <label>Gender:</label>
            <input id="Gender" type="text" placeholder="Male/Female" /><br /><br />
            
            <label>Weight (kg):</label>
            <input id="Weight" type="number" placeholder="67" /><br /><br />
            
            <label>Height (cm):</label>
            <input id="Height" type="number" placeholder="180" /><br /><br />

            <button id="submit-btn" type="submit">Calculate & Save</button>
        </form>

        <p>Saved Results:</p>
        <section>
            <ul id="users"></ul>
        </section>
    </main>
</body>
</html>
